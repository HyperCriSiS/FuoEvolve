name: Recognition migration runner

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute embedded migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/refactor-recognition-once.yml').read_text()
          marker = "python3 - <<'PY'\n"
          if source.count(marker) != 1:
              raise SystemExit('embedded migration marker not found exactly once')
          script = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(script), '<recognition-migration>', 'exec'))
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-recognition-once.yml
          git rm .github/workflows/refactor-recognition-pr-once.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor: decouple recognition from FuoPlayerController"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
