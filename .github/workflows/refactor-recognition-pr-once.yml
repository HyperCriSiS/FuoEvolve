name: Recognition migration runner

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute embedded migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/refactor-recognition-once.yml').read_text()
          marker = "python3 - <<'PY'\n"
          if source.count(marker) != 1:
              raise SystemExit('embedded migration marker not found exactly once')
          embedded = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          lines = embedded.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          target_literal = '"""                                                onOpenRecognition = controller::openRecognition,"""'
          if script.count(target_literal) != 1:
              raise SystemExit('AppRoot standalone recognition replacement not found exactly once')
          target_pos = script.index(target_literal)
          call_start = script.rfind('replace_once(', 0, target_pos)
          call_end = script.index('\n)', target_pos) + 2
          call = script[call_start:call_end]
          patched_call = call.replace('replace_once(', 'replace_count(', 1)
          patched_call = patched_call[:-2] + '\n    2,\n)'
          script = script[:call_start] + patched_call + script[call_end:]

          search_marker = 'AppRoute.Search -> SearchRoute('
          search_pos = script.index(search_marker)
          old_search_callback = 'onOpenRecognition = controller::openRecognition,'
          callback_pos = script.index(old_search_callback, search_pos)
          script = (
              script[:callback_pos]
              + 'onOpenRecognition = appViewModel::openRecognition,'
              + script[callback_pos + len(old_search_callback):]
          )

          exec(compile(script, '<recognition-migration>', 'exec'))
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-recognition-once.yml
          git rm .github/workflows/refactor-recognition-pr-once.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor: decouple recognition from FuoPlayerController"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
