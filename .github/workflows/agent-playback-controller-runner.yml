name: Playback controller refactor runner

"on":
  pull_request:
    branches:
      - agent/playback-controller-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'refactor/player-controller-queue' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply refactor
        shell: bash
        run: |
          if [ -f .github/agent/run-queue-refactor.py ]; then
            python3 .github/agent/run-queue-refactor.py
          elif [ -f .github/agent/refactor-playback-controller.py ]; then
            python3 .github/agent/refactor-playback-controller.py
          else
            echo "Refactor already applied"
          fi

      - name: Run shared tests
        run: ./gradlew :shared:allTests

      - name: Commit refactored sources
        shell: bash
        run: |
          rm -f .github/agent/refactor-playback-controller.py .github/agent/run-queue-refactor.py
          rmdir .github/agent 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract playback queue controller"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  cleanup-merged-branches:
    if: github.event.pull_request.head.ref == 'agent/cleanup-merged-branches' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete safely merged remote branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELF_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${REPO%%/*}"
          deleted=0
          skipped=0

          mapfile -t open_bases < <(
            gh pr list --repo "$REPO" --state open --limit 500 \
              --json baseRefName --jq '.[].baseRefName' | sort -u
          )
          mapfile -t open_heads < <(
            gh pr list --repo "$REPO" --state open --limit 500 \
              --json headRefName,headRepositoryOwner \
            | jq -r --arg owner "$owner" '.[] | select((.headRepositoryOwner.login // "") == $owner) | .headRefName' \
            | sort -u
          )

          is_in_array() {
            local needle="$1"
            shift
            local item
            for item in "$@"; do
              [[ "$item" == "$needle" ]] && return 0
            done
            return 1
          }

          mapfile -t merged_prs < <(
            gh pr list --repo "$REPO" --state merged --base "$DEFAULT_BRANCH" --limit 1000 \
              --json number,headRefName,headRepositoryOwner,mergedAt \
            | jq -r --arg owner "$owner" \
                '.[] | select((.headRepositoryOwner.login // "") == $owner) | [.mergedAt, (.number|tostring), .headRefName] | @tsv' \
            | sort -r \
            | awk -F '\t' '!seen[$3]++ { print $1 "\t" $2 "\t" $3 }'
          )

          echo "Default branch: $DEFAULT_BRANCH"
          echo "Merged PR head candidates: ${#merged_prs[@]}"

          for row in "${merged_prs[@]}"; do
            merged_at="${row%%$'\t'*}"
            rest="${row#*$'\t'}"
            pr_number="${rest%%$'\t'*}"
            branch="${rest#*$'\t'}"

            case "$branch" in
              ""|"$DEFAULT_BRANCH"|"$SELF_BRANCH"|backup/*|refactor/player-controller-playback-core|refactor/player-controller-queue|agent/playback-controller-runner|agent/playback-fix-runner)
                echo "KEEP explicit: $branch"
                continue
                ;;
            esac

            if is_in_array "$branch" "${open_bases[@]}" || is_in_array "$branch" "${open_heads[@]}"; then
              echo "KEEP open-PR dependency: $branch"
              ((skipped+=1))
              continue
            fi

            encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
            branch_json="$(gh api "repos/$REPO/branches/$encoded" 2>/dev/null || true)"
            if [[ -z "$branch_json" ]]; then
              continue
            fi
            if [[ "$(jq -r '.protected' <<<"$branch_json")" == "true" ]]; then
              echo "KEEP protected: $branch"
              ((skipped+=1))
              continue
            fi

            current_sha="$(jq -r '.commit.sha // empty' <<<"$branch_json")"
            if [[ -z "$current_sha" ]]; then
              echo "KEEP no commit SHA: $branch"
              ((skipped+=1))
              continue
            fi
            commit_json="$(gh api "repos/$REPO/commits/$current_sha")"
            branch_commit_at="$(jq -r '.commit.committer.date // .commit.author.date // empty' <<<"$commit_json")"
            if [[ -z "$branch_commit_at" ]]; then
              echo "KEEP no commit timestamp: $branch"
              ((skipped+=1))
              continue
            fi

            branch_epoch="$(date -u -d "$branch_commit_at" +%s)"
            merged_epoch="$(date -u -d "$merged_at" +%s)"
            if (( branch_epoch > merged_epoch )); then
              echo "KEEP advanced after merge: $branch (branch=$branch_commit_at merged=$merged_at)"
              ((skipped+=1))
              continue
            fi

            echo "DELETE $branch (PR #$pr_number, last commit $branch_commit_at, merged $merged_at)"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            ((deleted+=1))
          done

          echo "Deleted merged branches: $deleted"
          echo "Skipped for safety: $skipped"

          echo "DELETE temporary cleanup branch: $SELF_BRANCH"
          gh api --method DELETE "repos/$REPO/git/refs/heads/$SELF_BRANCH" || true
