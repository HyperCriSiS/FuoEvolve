name: Playback controller refactor runner

"on":
  pull_request:
    branches:
      - agent/playback-controller-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'refactor/player-controller-playback-core' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply refactor
        shell: bash
        run: |
          if [ -f .github/agent/refactor-playback-controller.py ]; then
            python3 .github/agent/refactor-playback-controller.py
          else
            echo "Refactor already applied"
          fi

      - name: Run shared tests
        run: ./gradlew :shared:allTests

      - name: Commit refactored sources
        shell: bash
        run: |
          rm -f .github/agent/refactor-playback-controller.py
          rmdir .github/agent 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract playback controller module"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
