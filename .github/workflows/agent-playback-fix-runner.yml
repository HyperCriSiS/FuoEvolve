name: Playback fix runner

"on":
  pull_request:
    branches:
      - agent/playback-fix-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'agent/restore-playback-state' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply patch
        shell: bash
        run: |
          if grep -q 'private var isPlaybackQueueLoaded: Boolean = false' shared/src/commonMain/kotlin/org/feeluown/mobile/FuoPlayerController.kt; then
            echo "Playback fix already applied"
          else
            python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/agent-restore-playback-state.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run shared tests"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply_playback_fix.py').write_text('\n'.join(lines) + '\n')
          PY
            python3 /tmp/apply_playback_fix.py
          fi

      - name: Run shared tests
        run: ./gradlew :shared:allTests

      - name: Commit patched sources
        shell: bash
        run: |
          rm -f .github/workflows/agent-restore-playback-state.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete playback state after process restart"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
