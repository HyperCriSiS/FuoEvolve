name: One-shot German test localization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply German test localization
        run: python scripts/localize_de_test.py

      - name: Keep workflow changes out of bot commit
        run: git checkout -- .github/workflows/android-apk.yml

      - name: Commit localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add androidApp/src/main/res/values/strings.xml shared/src/commonMain/kotlin/org/feeluown/mobile/feature
          git diff --cached --quiet && exit 0
          git commit -m "feat: add German test interface"
          git push origin HEAD:master
