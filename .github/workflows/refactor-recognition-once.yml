          Path("shared/src/commonTest/kotlin/org/feeluown/mobile/AudioRecognitionControllerTest.kt").write_text(r'''package org.feeluown.mobile

import kotlinx.coroutines.awaitCancellation
import kotlinx.coroutines.test.advanceUntilIdle
import kotlinx.coroutines.test.runCurrent
import kotlinx.coroutines.test.runTest
import kotlin.test.Test
import kotlin.test.assertEquals
import kotlin.test.assertIs

class AudioRecognitionControllerTest {
    @Test
    fun startOwnsStateAndPausesActivePlayback() = runTest {
        val song = RecognizedSong(
            neteaseSongId = "123",
            title = "Song",
            artists = listOf("Artist"),
            album = "Album",
        )
        val repository = object : AudioRecognitionRepository {
            override suspend fun recognize(onEvent: (AudioRecognitionEvent) -> Unit): List<RecognizedSong> {
                onEvent(AudioRecognitionEvent.Capturing(attempt = 1, capturedMs = 1_000))
                onEvent(AudioRecognitionEvent.Matching(attempt = 1))
                return listOf(song, song)
            }

            override fun cancel() = Unit
        }
        var pauseCount = 0
        val controller = createRecognitionFeatureController(
            repository = repository,
            scope = this,
            isPlaybackActive = { true },
            pausePlayback = { pauseCount += 1 },
        )

        controller.dispatch(RecognitionAction.Start)
        advanceUntilIdle()

        assertEquals(1, pauseCount)
        assertEquals(RecognitionUiState.Success(listOf(song)), controller.uiState.value)
    }

    @Test
    fun cancelIfInProgressCancelsRepositoryAndPublishesCancelled() = runTest {
        var cancelCount = 0
        val repository = object : AudioRecognitionRepository {
            override suspend fun recognize(onEvent: (AudioRecognitionEvent) -> Unit): List<RecognizedSong> {
                onEvent(AudioRecognitionEvent.Capturing(attempt = 1, capturedMs = 500))
                awaitCancellation()
            }

            override fun cancel() {
                cancelCount += 1
            }
        }
        val controller = createRecognitionFeatureController(
            repository = repository,
            scope = this,
            isPlaybackActive = { false },
            pausePlayback = {},
        )

        controller.dispatch(RecognitionAction.Start)
        runCurrent()
        assertIs<RecognitionUiState.Capturing>(controller.uiState.value)

        controller.dispatch(RecognitionAction.CancelIfInProgress)
        runCurrent()

        assertEquals(1, cancelCount)
        assertEquals(RecognitionUiState.Cancelled, controller.uiState.value)
    }

    @Test
    fun closeReturnsFeatureToIdle() = runTest {
        val repository = object : AudioRecognitionRepository {
            override suspend fun recognize(onEvent: (AudioRecognitionEvent) -> Unit): List<RecognizedSong> = emptyList()
            override fun cancel() = Unit
        }
        val controller = createRecognitionFeatureController(
            repository = repository,
            scope = this,
            isPlaybackActive = { false },
            pausePlayback = {},
            initialState = RecognitionUiState.Cancelled,
        )

        controller.dispatch(RecognitionAction.Close)

        assertEquals(RecognitionUiState.Idle, controller.uiState.value)
    }
}
''')

          Path("docs/player-controller-refactor.md").write_text(r'''# FuoPlayerController refactor

The controller migration is intentionally incremental. `FuoPlayerController` remains a compatibility facade while feature state and UI contracts move to narrower owners.

## Phase 1: search ownership

Search ownership has moved out of `FuoPlayerController`.

- `SearchFeatureScreen` consumes `SearchUiState`, provider/download snapshots, `SearchAction`, and narrow cross-feature callbacks instead of `FuoPlayerController`.
- `SearchFeatureController` is constructed by the Android/iOS composition roots. The same owner instance is injected into `FuoAppViewModel` and the compatibility `FuoPlayerController` facade, so production has one search state owner.
- `SearchRoute` is the app-shell composition point for search UI. The temporary bridge has been removed.
- Search scope/provider preferences are restored into the feature owner and persisted through `AppSettingsRepository`.
- Search provider ordering/selection comes from `AppSettings`, while actual provider availability is gated by initialized `ProviderSessionRepository` providers.

## Phase 2: recognition ownership

Recognition now follows the same ownership model.

- `RecognitionFeatureController` owns `StateFlow<RecognitionUiState>` and recognition operations through `RecognitionAction`.
- Android/iOS composition roots construct the recognition owner from the platform `AudioRecognitionRepository` and `PlaybackEngine`; pausing active playback no longer routes through `FuoPlayerController`.
- `RecognitionRoute` composes `AudioRecognitionFeatureScreen` from feature state/actions plus narrow provider-detail/search callbacks.
- Permission changes and app-background cancellation enter through `FuoAppViewModel`, not the global controller.
- `FuoPlayerController` keeps only compatibility delegates to the same injected recognition owner, so production still has a single recognition state.
- Focused controller tests cover success/state ownership, playback pause, cancellation, and close/reset behavior.

## Next phases

1. Remove remaining Search/Recognition compatibility delegates as local-music metadata lookup, provider detail navigation, and playback result actions move to explicit app/domain boundaries.
2. Apply the feature-owned state plus app-shell composition pattern to local music, downloads, provider content, and settings.
3. Extract playback runtime ownership into a `PlaybackSession` so platform services and player UI no longer coordinate through `FuoPlayerController`.
4. Remove remaining legacy aggregate provider dependencies and global loading/message state as feature owners become authoritative.
''')

          Path("shared/src/commonMain/kotlin/org/feeluown/mobile/feature/README.md").write_text(r'''# Feature source layout

Feature directories are a migration boundary, not new Kotlin packages yet. Source files continue to declare `org.feeluown.mobile` so this restructuring does not change symbol visibility or require a broad import rewrite.

New feature-specific controller/state/UI files should be placed in the corresponding feature directory. Cross-feature models belong in `core/model`; reusable Compose/UI abstractions belong in `core/ui`; app shell/navigation belongs in `app`.

Do not add new feature behavior to `FuoPlayerController` unless it is playback-specific. Prefer feature-local state and narrow provider capability interfaces.

Feature UI should not take `FuoPlayerController` as its long-term state/action contract. App-shell composition should connect a feature-owned state/controller to narrow cross-feature callbacks. Search and recognition are the reference migrations: their feature controllers are created by the platform composition roots, app-shell routes wire their screens, and `FuoPlayerController` only retains temporary compatibility delegates to the same owners. New migrations should avoid adding a bridge or duplicate feature state when the feature owner can be injected directly.
''')
